name: 构建并发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: lishuiorg/lishui-kit/.github/workflows/site-deploy.yml@main
    with:
      site: site-jiezhen
      siteId: lishui-towns
